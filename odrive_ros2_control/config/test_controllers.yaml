controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_trajectory_controller:
  ros__parameters:
    joints:
      - test_joint_1
      - test_joint_2
      - test_joint_3

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
